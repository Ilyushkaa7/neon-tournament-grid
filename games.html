<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0f1f1c, #050807);
  font-family: Arial;
  padding: 80px 10px 40px;
  color: #7fffd4;
  cursor: url('https://cur.cursors-4u.net/cursors/cur-2/cur116.cur'), auto;
}

/* TOP UI */
.top-ui {
  position: fixed;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 12px;
  z-index: 1000;
}

.btn {
  color: #00ffae;
  border: 2px solid #00ffae;
  padding: 8px 18px;
  border-radius: 30px;
  background: rgba(0,0,0,0.5);
  text-decoration: none;
  transition: 0.3s;
  cursor: pointer;
}

.btn:hover {
  background: #00ffae;
  color: #050807;
  box-shadow: 0 0 12px #00ffae;
}

.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ГЛАВНЫЙ GRID */
.bracket {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
  gap: 60px;
  align-items: start;
}

/* КОЛОНКА */
.round {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* МАТЧ */
.match {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

/* TEAM */
.team {
  width: 140px;
  height: 75px;
  border: 2px solid #00ffae;
  border-radius: 12px;
  box-shadow: 0 0 6px #00ffae;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

.team img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.label {
  position: absolute;
  bottom: 6px;
  left: 6px;
  font-size: 11px;
  background: rgba(0,0,0,0.5);
  padding: 2px 6px;
  border-radius: 6px;
}

.score {
  font-size: 12px;
  color: #00ffae;
}

/* LOWER теперь НЕ ломает сетку */
.lower {
  margin-top: 70px;
  display: flex;
  justify-content: center;
  width: 100%;
  border-top: 1px dashed #00ffae;
  padding-top: 20px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.box {
  background: #08110f;
  border: 1px solid #00ffae;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

.close-btn {
  margin-top: 15px;
  display: inline-block;
  color: #00ffae;
  border: 2px solid #00ffae;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
}

.close-btn:hover {
  background: #00ffae;
  color: #050807;
}
</style>
</head>

<body>

<div class="top-ui">
  <a href="index.html" class="btn">←</a>
  <div class="btn" onclick="openHelp()">💬</div>
</div>

<div class="wrapper">

<div class="bracket">

  <!-- ROUND 1 -->
  <div class="round">
    <div class="match">
      <div class="team"><img src="img/СЛОНЯРЫ.jpg"><span class="label">Team 1</span></div>
      <div class="score">0 : 2</div>
      <div class="team"><img src="img/322.jpg"><span class="label">Team 2</span></div>
    </div>

    <div class="match">
      <div class="team"><img src="img/РПО-3.jpg"><span class="label">Team 4</span></div>
      <div class="score">2 : 0</div>
      <div class="team"><img src="img/КУЗЬМИН-ТИМ.jpg"><span class="label">Team 5</span></div>
    </div>

    <div class="match">
      <div class="team"><img src="img/МЕГА-АНДОНЫ.jpg"><span class="label">Team 3</span></div>
      <div class="score">2 : 0</div>
      <div class="team"><img src="img/РПО-3.jpg"><span class="label">Team 4</span></div>
    </div>
  </div>

  <!-- ROUND 2 -->
  <div class="round">
    <div class="match">
      <div class="team"><img src="img/322.jpg"><span class="label">Team 2</span></div>
      <div class="score">2 : 0</div>
      <div class="team"><img src="img/МЕГА-АНДОНЫ.jpg"><span class="label">Team 3</span></div>
    </div>
  </div>

  <div class="round">
    <div class="match">
      <div class="team"><img src="img/МЕГА-АНДОНЫ.jpg"><span class="label">Team 3</span></div>
      <div class="score">0 : 2</div>
      <div class="team"><img src="img/РПО-3.jpg"><span class="label">Team 4</span></div>
    </div>
  </div>

  <!-- ФИНАЛ -->
  <div class="round">
    <div class="match">
      <div class="team"><img src="img/322.jpg"><span class="label">Team 2</span></div>
      <div class="score">0 : 0</div>
      <div class="team"><img src="img/РПО-3.jpg"><span class="label">Team 3</span></div>
    </div>
  </div>
<!-- MODAL -->
<div class="modal" id="help">
  <div class="box">
    Слоняры не захотели играть даже вторую катку в первом раунде - распались. Кузьмин Тим 3 раза не могли нормально собрать команду - распались.
    <div class="close-btn" onclick="closeHelp()">Закрыть</div>
  </div>
</div>

<script>
function openHelp(){
  document.getElementById('help').style.display='flex';
}

function closeHelp(){
  document.getElementById('help').style.display='none';
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    closeHelp();
  }
});
</script>

</body>
</html>
