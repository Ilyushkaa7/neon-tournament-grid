<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bracket Neon</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #0f1f1c, #050807);
  font-family: Arial, sans-serif;
}

/* ЛОГОТИПЫ */
.logos {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.logo {
  width: 70px;
  height: 70px;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #00ffae;
  box-shadow: 0 0 10px #00ffae;
  background: #000;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.wrapper {
  width: 100%;
  max-width: 1200px;
  overflow-x: auto;
}

.bracket {
  display: flex;
  gap: 60px;
  padding: 40px;
  min-width: 800px;
}

.round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
}

.match {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 25px 0;
}

.team {
  width: 160px;
  height: 95px;
  border: 2px solid #00ffae;
  border-radius: 12px;
  box-shadow: 0 0 8px #00ffae, inset 0 0 10px rgba(0,255,170,0.2);
  overflow: hidden;
  position: relative;
  transition: 0.3s;
  background: #000;
}

.team:hover {
  box-shadow: 0 0 15px #00ffae, 0 0 30px #00ffae;
  transform: scale(1.03);
}

.team img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder {
  position: absolute;
  bottom: 5px;
  left: 6px;
  font-size: 12px;
  color: #7fffd4;
  background: rgba(0,0,0,0.5);
  padding: 2px 6px;
  border-radius: 6px;
}

/* адаптив */
@media (max-width: 768px) {
  .bracket {
    gap: 30px;
    padding: 20px;
  }

  .team {
    width: 120px;
    height: 70px;
  }

  .logo {
    width: 50px;
    height: 50px;
  }
}

@media (max-width: 480px) {
  .team {
    width: 100px;
    height: 60px;
  }
}
</style>
</head>

<body>

<!-- ЛОГОТИПЫ -->
<div class="logos">
  <div class="logo">
    <img src="img/ITTOP.jpg">
  </div>
  <div class="logo">
    <img src="img/IlyFre.png">
  </div>
</div>

<div class="wrapper">
<div class="bracket">

  <!-- Round 1 -->
  <div class="round">
    <div class="match">
      <div class="team">
        <img src="img/СЛОНЯРЫ.jpg">
        <div class="placeholder">Team 1</div>
      </div>

      <div class="team">
        <img src="img/322.jpg">
        <div class="placeholder">Team 2</div>
      </div>
    </div>

    <div class="match">
      <div class="team">
        <img src="img/МЕГА-АНДОНЫ.jpg">
        <div class="placeholder">Team 3</div>
      </div>

      <div class="team">
        <img src="img/РПО-3.jpg">
        <div class="placeholder">Team 4</div>
      </div>
    </div>
  </div>

  <!-- Winners -->
  <div class="round">
    <div class="match">
      <div class="team">
        <img src="img/winA.jpg">
        <div class="placeholder">Winner A</div>
      </div>
    </div>

    <div class="match">
      <div class="team">
        <img src="img/winB.jpg">
        <div class="placeholder">Winner B</div>
      </div>
    </div>
  </div>

  <!-- Round 2 -->
  <div class="round">
    <div class="match">
      <div class="team">
        <img src="img/winA.jpg">
        <div class="placeholder">Winner A</div>
      </div>

      <div class="team">
        <img src="img/КУЗЬМИН-ТИМ.jpg">
        <div class="placeholder">Team 5</div>
      </div>
    </div>

    <div class="match">
      <div class="team">
        <img src="img/winB.jpg">
        <div class="placeholder">Winner B</div>
      </div>

      <div class="team">
        <img src="img/КУЗЬМИН-ТИМ.jpg">
        <div class="placeholder">Team 5</div>
      </div>
    </div>
  </div>

  <!-- Winners to Final -->
  <div class="round">
    <div class="match">
      <div class="team">
        <img src="img/winC.jpg">
        <div class="placeholder">Winner C</div>
      </div>
    </div>

    <div class="match">
      <div class="team">
        <img src="img/winD.jpg">
        <div class="placeholder">Winner D</div>
      </div>
    </div>
  </div>

  <!-- Final -->
  <div class="round">
    <div class="match">
      <div class="team">
        <img src="img/ilyfre.jpg">
        <div class="placeholder">FINAL</div>
      </div>
    </div>
  </div>

</div>
</div>

</body>
</html>
