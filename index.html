<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament grid</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f1f1c, #050807);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px 10px;
}

/* логотипы + кнопка в одной линии */
.top-bar {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
}

.logos {
  display: flex;
  gap: 12px;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid #00ffae;
  box-shadow: 0 0 8px #00ffae;
  background: #000;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* кнопка Игры — справа */
.games-btn {
  color: #00ffae;
  text-decoration: none;
  border: 2px solid #00ffae;
  padding: 8px 20px;
  border-radius: 30px;
  font-weight: bold;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  transition: 0.3s;
}

.games-btn:hover {
  background: #00ffae;
  color: #050807;
  box-shadow: 0 0 12px #00ffae;
}

/* контейнер */
.bracket {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  width: 100%;
  max-width: 420px;
  margin-top: 80px;
}

/* строка */
.row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 80px;
}

/* колонка */
.col {
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
}

/* карточки */
.team {
  width: 140px;
  height: 75px;
  border: 2px solid #00ffae;
  border-radius: 12px;
  box-shadow: 0 0 6px #00ffae, inset 0 0 8px rgba(0,255,170,0.2);
  position: relative;
  overflow: hidden;
  transition: 0.3s;
}

.team:hover {
  box-shadow: 0 0 12px #00ffae, 0 0 25px #00ffae;
}

.team img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== ГЛАВНЫЙ ФИКС ДЛЯ .final ===== */
.final {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7fffd4;
  font-size: 20px;
  position: relative;
  overflow: hidden;
}

.final img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.final span {
  position: relative;
  z-index: 2;
  background: rgba(0,0,0,0.6);
  padding: 4px 10px;
  border-radius: 8px;
}

.label {
  position: absolute;
  bottom: 4px;
  left: 6px;
  font-size: 10px;
  color: #7fffd4;
  background: rgba(0,0,0,0.5);
  padding: 2px 5px;
  border-radius: 6px;
  z-index: 2;
}

.stage {
  text-align: center;
  color: #00ffae;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="top-bar">
  <div class="logos">
    <div class="logo"><img src="img/ITTOP.jpg" alt="ITTOP"></div>
    <div class="logo"><img src="img/IlyFre.png" alt="IlyFre"></div>
  </div>
  <a href="games.html" class="games-btn">Игры</a>
</div>

<div class="bracket">

  <div class="stage">Отборочный</div>

  <div class="row">
    <div class="col">
      <div class="team"><img src="img/СЛОНЯРЫ.jpg"><span class="label">Team 1</span></div>
      <div class="team"><img src="img/322.jpg"><span class="label">Team 2</span></div>
      <div class="team"><img src="img/МЕГА-АНДОНЫ.jpg"><span class="label">Team 3</span></div>
    </div>
    <div class="col">
      <div class="team"><img src="img/РПО-3.jpg"><span class="label">Team 4</span></div>
      <div class="team"><img src="img/КУЗЬМИН-ТИМ.jpg"><span class="label">Team 5</span></div>
    </div>
  </div>

  <div class="stage">Полуфинал</div>
  
  <div class="row">
    <div class="team final">
      <img src="img/РПО-3.jpg">
    </div>
  </div>

  <div class="row">
    <div class="team final">
      <img src="img/МЕГА-АНДОНЫ.jpg">
    </div>
  </div>

  <div class="stage">Финал в ПК клубе</div>
  
  <div class="row">
    <div class="team final">
      <img src="img/322.jpg">
    </div>
  </div>

  <div class="row">
    <div class="team final">
      <img src="img/РПО-3.jpg">
    </div>
  </div>

  <div class="stage">Победитель</div>
  
  <div class="row">
    <div class="team final">
      🏆
    </div>
  </div>

</div>

</body>
</html>
